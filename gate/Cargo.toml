[package]
name = "rust-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Every step of the reusable Rust workflows, as one binary built from the pinned commit"
license = "MIT"
publish = false

# Standard library only: the gate is built before any registry is configured,
# and a dependency would be a second supply chain to review.
[dependencies]

[profile.release]
strip = true

# The lint levels every `cargo clippy` applies, editor included; the justfile's
# `-D warnings` makes them errors in the gate. Thresholds live in clippy.toml.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
