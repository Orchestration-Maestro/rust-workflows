minimum_prek_version: '0.5.0'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: check-json
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        language: system
        entry: rustfmt +1.98.1 --check --edition 2024
        types: [rust]
      - id: just-format
        name: Just formatting
        language: system
        entry: just --unstable --fmt --check
        files: '(^|/)justfile$'
        pass_filenames: false
      - id: yamlfmt
        name: YAML formatting
        language: system
        entry: yamlfmt -no_global_conf -lint
        types: [yaml]
        pass_filenames: false
      - id: taplo
        name: TOML formatting
        language: system
        entry: taplo fmt --check --diff
        types: [toml]
      - id: typos
        name: Spelling in code and prose
        language: system
        entry: typos --force-exclude
      - id: gitleaks
        name: Secrets in the staged change
        language: system
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false
      - id: shellcheck
        name: Shell lint
        language: system
        entry: shellcheck
        types: [shell]
      - id: shfmt
        name: Shell formatting
        language: system
        entry: shfmt -d
        types: [shell]
      - id: rumdl
        name: Markdown structure
        language: system
        entry: rumdl check --no-cache
        types: [markdown]
      - id: lychee
        name: Markdown links, offline
        language: system
        entry: lychee --offline --no-progress
        types: [markdown]
      - id: editorconfig-checker
        name: Every file against .editorconfig
        language: system
        entry: editorconfig-checker -disable-indent-size
      - id: actionlint
        name: GitHub workflow lint
        language: system
        entry: actionlint -config-file .github/actionlint.yml
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: zizmor
        name: GitHub workflow security audit
        language: system
        entry: zizmor --offline --persona=pedantic --no-progress --config .github/zizmor.yml
        files: '^(\.github/(workflows/.*|dependabot|actions/.*/action)\.ya?ml|action\.ya?ml)$'
      - id: generated-documents
        name: Generated tables match their sources
        language: system
        entry: just docs
        files: '^(\.github/(workflows/.*\.ya?ml|assets/how-it-works\.svg)|mise\.toml|justfile|README\.md|docs/.*|gate/src/.*\.rs)$'
        pass_filenames: false
      - id: conventional-commit-header
        name: Commit message opens with a conventional header
        language: pygrep
        entry: '\A(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [a-z][^\n]{0,70}\n'
        args: [--negate, --multiline]
        stages: [commit-msg]
      - id: eighty-columns
        name: Commit message lines stay within 80 columns
        language: pygrep
        entry: '^.{81,}$'
        stages: [commit-msg]
