[package]
name = "workflow-contract-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[[test]]
name = "workflows"
path = "workflows.rs"

[features]
native-windows = []

[[test]]
name = "native_windows"
path = "native_windows.rs"
required-features = ["native-windows"]

[dev-dependencies]
serde_json = "=1.0.151"

# The lint levels every `cargo clippy` applies, editor included; the justfile's
# `-D warnings` makes them errors in the gate. Thresholds live in clippy.toml.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
