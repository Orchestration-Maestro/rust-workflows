# Blank issues are disabled so every report arrives with the fields triage needs.
# That only works if the routes a form cannot serve are visible on the chooser
# page itself: a vulnerability report must never be the reporter's first public
# issue, and a question should not have to be filed as a bug to be asked.
blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability
    url: https://github.com/Orchestration-Maestro/maestro-rust-workflows/security/policy
    about: >-
      Report privately, never as a public issue. This covers exposed credentials
      and any weakness in the publication, permission or supply-chain boundaries.
  - name: Ask a question or get help
    url: https://github.com/Orchestration-Maestro/maestro-rust-workflows/blob/main/SUPPORT.md
    about: >-
      Usage questions, adoption help and which workflow fits a given repository.
  - name: Read the workflow contracts
    url: https://github.com/Orchestration-Maestro/maestro-rust-workflows/blob/main/docs/ci.md
    about: >-
      Every input, every produced report and every quality gate, before opening a
      request for behaviour that already exists.
