name: Publish Rust release evidence
# Contract: Dry-run-first archive of release reports; live assets only on protected-tag GitHub Releases
# Ordinary CI artifacts expire. This opt-in workflow archives release reports
# as assets on an existing GitHub Release, not as durable evidence for every run.
'on':
  workflow_call:
    inputs:
      artifact-name:
        description: >-
          CI artifact name, without its `-reports` suffix; downloaded from this
          run
        type: string
        required: true
      revision:
        description: >-
          Immutable source SHA, equal to `github.sha` and the scorecard revision
        type: string
        required: true
      dry-run:
        description: >-
          Validate reports and create a local archive only
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: rust-evidence-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  preflight:
    name: Validate the publication boundary
    if: ${{ github.event_name != 'pull_request_target' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read  # inspect release environment reviewers and tag policies
    steps:
      - name: Build the gate
        uses: Orchestration-Maestro/rust-workflows/.github/actions/gate@4f1bef9262c4cd87fccf7683fa1872465c7af7a9  # rust-workflows: the commit that ships this gate
      - name: Install verified JSON tool
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Validate publication boundary
        id: authorize
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: rust-gate publish-evidence authorize
  stage:
    name: Validate the release reports
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Build the gate
        uses: Orchestration-Maestro/rust-workflows/.github/actions/gate@4f1bef9262c4cd87fccf7683fa1872465c7af7a9  # rust-workflows: the commit that ships this gate
      - name: Install verified JSON tool
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Download run reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}-reports
          path: evidence
      - name: Validate evidence before publishing
        id: validate
        env:
          REVISION: ${{ inputs.revision }}
        run: rust-gate publish-evidence validate
  publish:
    name: Publish the release reports
    needs: [stage]
    if: ${{ !inputs.dry-run }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # upload assets to the existing GitHub Release
      actions: read  # inspect release environment reviewers and tag policies
    steps:
      - name: Build the gate
        uses: Orchestration-Maestro/rust-workflows/.github/actions/gate@4f1bef9262c4cd87fccf7683fa1872465c7af7a9  # rust-workflows: the commit that ships this gate
      - name: Install verified JSON tool
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Download run reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}-reports
          path: evidence
      - name: Validate evidence before publishing
        env:
          REVISION: ${{ inputs.revision }}
        run: rust-gate publish-evidence validate
      - name: Upload evidence to the existing release
        id: upload
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: rust-gate publish-evidence upload
