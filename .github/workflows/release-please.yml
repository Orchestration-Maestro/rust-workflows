name: Release
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    name: Release pull request and tag
    # Skipped until the release GitHub App is configured; see CONTRIBUTING.md.
    if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A GitHub App token, not GITHUB_TOKEN: the organization forbids
      # GITHUB_TOKEN from opening pull requests, and a pull request it opened
      # would trigger none of the checks a merge requires.
      - name: Mint the release token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Open the release pull request, or tag the merged one
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
