name: Hygiene
# Contract: The checks every repository holds to, for one without Rust: secrets, hygiene, the pull request title and branch, managed files and the commit hooks over every file
"on":
  # The organization's hygiene-ci ruleset requires this file on every pull
  # request of a repository without Rust, in that repository's context.
  pull_request:
  merge_group:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  # The reusable workflow of a repository without Rust: the checks every
  # repository holds to, whatever its language. The job's name is the check the
  # hygiene-required ruleset requires, "hygiene / Required hygiene".
  hygiene:
    name: Required hygiene
    # This repository holds itself to ci-internal.yml, not to this file. It
    # is found by its id, which a rename leaves alone.
    if: ${{ github.repository_id != '1382744803' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      # Replaces the gate's checkout: another repository's is deleted first.
      - name: Checkout consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Name the checkout and the reports directory
        id: prepare
        run: rust-gate hygiene prepare
      - name: Install verified tools
        id: install
        run: rust-gate install-tools
        env:
          # Each asset pinned by checksum, the rows ci.yml installs.
          TOOLS: |
            jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
            gitleaks gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks
      - name: Redacted source secret scan
        id: secrets
        env:
          SARIF_REPORTS: "false"
        run: rust-gate secrets
      - name: Repository hygiene HYG and the width of shell scripts
        id: hygiene
        run: rust-gate hygiene
      - name: Managed files as the organization renders them
        id: managed-files
        run: rust-gate managed-files
      - name: Commit hooks over every file
        id: hooks
        env:
          # The step installs the toolbelt `rust-gate setup` installs, prek
          # and every hook's tool; mise asks GitHub's API for each release's
          # attestations, and an anonymous runner shares its rate limit with
          # every other job on its address.
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: rust-gate hooks
      # Last: a title or a branch outside the conventions must not hide what
      # the checks above would say.
      - name: Pull request title and branch PRL-003 and PRL-004
        id: pull-request-names
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: rust-gate hygiene pull-request-names
