name: Upload coverage
# Contract: The same run's LCOV coverage and JUnit test results into Codecov, through OIDC; isolated so only its job needs `id-token: write`, and skipped for fork pull requests
# A separate workflow, as for SARIF: logging in to Codecov through OIDC needs
# id-token: write, and GitHub checks every job's scopes at startup, so holding
# the upload in ci.yml would force that grant on every CI caller.
"on":
  workflow_call:
    inputs:
      artifact-name:
        description: >-
          The `artifact-name` output of `ci.yml` in the same run
        type: string
        required: true
permissions:
  contents: read
jobs:
  upload:
    name: Upload coverage and test results to Codecov
    # A fork pull request gets no OIDC token; its reports stay in the reports
    # artifact.
    if: ${{ github.event_name != 'pull_request_target' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # log in to Codecov with OIDC instead of a stored token
    steps:
      # Codecov maps the report's absolute paths onto this checkout's files.
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}-reports
          path: reports
      # The action verifies the Codecov CLI's signature before running it;
      # `version` pins which CLI that is.
      - name: Upload line coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: reports/coverage.lcov
          report_type: coverage
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          version: v11.3.1
      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: reports/tests.xml
          report_type: test_results
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          version: v11.3.1
