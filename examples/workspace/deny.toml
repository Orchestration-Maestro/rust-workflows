# Consumer-owned licence policy for this fixture. The reusable CI workflow
# applies this file when `license-policy` is `auto` (the default) or `enforce`.
# The sibling `binary` and `library` fixtures deliberately omit it so the
# not-applied branch stays exercised too.

[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
private = { ignore = true }

[advisories]
# A yanked crate stays resolvable from a committed lockfile long after its author
# withdrew it, which is a distinct failure from a published vulnerability. This
# check reads the registry index, so it runs only where the network is available.
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
