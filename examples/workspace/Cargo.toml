[workspace]
members = ["core", "app"]
resolver = "3"

# Every member takes these from here, so the members cannot drift apart.
[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
maestro-workspace-arithmetic = { path = "core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
