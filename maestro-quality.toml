# The organization's quality rules as this repository shapes them: the
# layers its two layered crates declare, the seams that keep one caller, each
# with its reason, and the words it means. Read by rust-gate architecture and
# rust-gate sync.

[[crate]]
root = "gate/src/main.rs"
layers = ["steps", "checks", "runner"]

[[crate]]
root = "tests/workflows.rs"
layers = ["ci gate nightly publishers repository", "harness"]

[[exception]]
rule = "ARC-005"
path = "gate/src/runner/mod.rs"
item = "enter"
reason = "the step registry is the only thing that can run a step"

[[exception]]
rule = "ARC-005"
path = "gate/src/runner/mod.rs"
item = "add_to_path"
reason = "the fourth GITHUB_* writer, beside export, output and summary"

[[exception]]
rule = "ARC-005"
path = "tests/harness/mod.rs"
item = "describe_text"
reason = "the gate's description of itself is read through the harness alone"

# The words this repository means that the spell checker reads as mistakes:
# FND, the identifier prefix of the Foundation standards in docs/standards.
[typos]
words = ["FND"]
